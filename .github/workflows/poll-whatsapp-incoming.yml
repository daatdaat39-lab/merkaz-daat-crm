name: Poll for incoming WhatsApp messages from InforU

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Pull incoming WhatsApp messages
        run: |
          curl -sf -X GET "https://merkaz-daat-crm-8ubv.vercel.app/api/cron/poll-whatsapp-incoming" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
